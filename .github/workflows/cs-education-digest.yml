name: Collect education articles

on:
  schedule:
    # Article collection runs daily. Gemini features are manual-only.
    - cron: "15 0 * * *"

  workflow_dispatch:
    inputs:
      generate_summaries:
        description: "Use Gemini for summaries on up to 2 newest articles per region; incurs API usage"
        required: false
        type: boolean
        default: false
      generate_gemini_digest:
        description: "Generate a Google Search-grounded Gemini education digest with source links; incurs API/search usage"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: education-article-collection
  cancel-in-progress: false

jobs:
  collect-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      # This job only discovers and publishes articles and RSS.
      - name: Collect articles and update feed
        env:
          SITE_URL: https://ajayyadavmit.github.io/cs_ai_education
        run: python scripts/collect_articles.py

      - name: Commit and push article data and RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/articles.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update collected education articles"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:refs/heads/main
          else
            echo "No article or RSS changes to publish."
          fi

  generate-gist-summaries:
    needs: collect-articles
    if: github.event_name == 'workflow_dispatch' && inputs.generate_summaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate article gist summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GENERATE_SUMMARIES: "true"
          SITE_URL: https://ajayyadavmit.github.io/cs_ai_education
        run: python scripts/collect_articles.py --summaries-only

      - name: Commit and push gist summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/articles.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Add Gemini article gist summaries"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:refs/heads/main
          else
            echo "No gist summary changes to publish."
          fi

  generate-gemini-education:
    needs: [collect-articles, generate-gist-summaries]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.generate_gemini_digest &&
      needs.collect-articles.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Google Search-grounded Gemini digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH_MODEL: gemini-3.8-flash
        run: python scripts/collect_articles.py --digest-only

      - name: Commit and push Gemini digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gemini_digest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Gemini education digest"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:refs/heads/main
          else
            echo "No Gemini digest changes to publish."
          fi
